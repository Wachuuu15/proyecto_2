filebeat.inputs:
  # Input tipo container - especializado para logs de Docker
  - type: container
    enabled: true
    paths:
      # Lee todos los logs de todos los contenedores
      - '/var/lib/docker/containers/*/*.log'
    processors:
      # Agrega metadata del contenedor (nombre, ID, imagen, etc.)
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      # Decodifica campos JSON en el mensaje
      - decode_json_fields:
          fields: ["message"]
          target: "json"
          overwrite_keys: true
    # Campos personalizados para instrumentación ampliada
    fields:
      service.environment: "lab"
      service.owner: "blue-team"
    fields_under_root: false

  # Input tipo log - Para logs de Blue Team (tráfico legítimo)
  - type: log
    enabled: true
    paths:
      # Lee logs del script de Blue Team
      - '/blue-team-logs/juice-blue-team.log'
    # Parse multiline para agrupar logs relacionados
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after
    # Campos personalizados para identificar logs de Blue Team
    fields:
      service.environment: "lab"
      service.owner: "blue-team"
      service.name: "blue-team-traffic-generator"
    fields_under_root: false
    # Agregar tags para facilitar filtrado
    tags: ["blue-team", "baseline", "legitimate-traffic"]
    # Nota: El parsing del formato del log se puede hacer en Elasticsearch con ingest pipelines si es necesario

  # Input tipo log - Para logs de Nginx (reverse proxy)
  - type: log
    enabled: true
    paths:
      # Lee logs de acceso y error de Nginx
      - '/var/log/nginx/juice_access.log'
      - '/var/log/nginx/juice_error.log'
    # Parse formato de log de acceso de Nginx (formato extendido)
    # Formato: $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
    # Se puede configurar un pattern personalizado si es necesario
    fields:
      service.environment: "lab"
      service.owner: "blue-team"
      service.name: "nginx-proxy"
    fields_under_root: false
    tags: ["nginx", "proxy", "reverse-proxy"]

# Procesadores globales que se aplican a todos los logs
processors:
  # Agrega informaci?n del host (hostname, OS, IP)
  - add_host_metadata:
      when.not.contains.tags: forwarded
  # Agrega metadata de cloud si est? en AWS/GCP/Azure
  - add_cloud_metadata: ~
  # Agrega metadata adicional de Docker
  - add_docker_metadata: ~

# Configuraci?n de salida a Elasticsearch
output.elasticsearch:
  # Host de Elasticsearch (usa variable de entorno o default)
  hosts: ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
  # Credenciales de Elasticsearch (si está habilitada la seguridad)
  username: "${ELASTICSEARCH_USERNAME:elastic}"
  password: "${ELASTICSEARCH_PASSWORD:changeme}"
  
  # Pipeline de ingest para normalización y detección de amenazas
  # Nota: El pipeline debe crearse primero en Elasticsearch (ver instrucciones en PASO_6_BLUE_TEAM.md)
  # Descomenta la siguiente línea después de crear el pipeline:
  pipeline: "juice-threat-normalizer"
  
  # ?ndices din?micos basados en el contenedor y tipo de log
  indices:
    # Logs de Blue Team van a su propio ?ndice
    # Se identifica por el campo personalizado service.owner
    - index: "filebeat-blue-team-%{+yyyy.MM.dd}"
      when.contains:
        fields.service.owner: "blue-team"
    # Logs de Juice Shop van a su propio ?ndice
    - index: "filebeat-juice-shop-%{+yyyy.MM.dd}"
      when.contains:
        container.name: "juice-shop"
    # Logs de Nginx van a su propio ?ndice
    - index: "filebeat-nginx-%{+yyyy.MM.dd}"
      when.contains:
        tags: "nginx"
    # Todos los dem?s logs van a ?ndice general
    - index: "filebeat-docker-%{+yyyy.MM.dd}"

# Configuraci?n de Kibana para dashboards
setup.kibana:
  host: "${KIBANA_HOST:kibana:5601}"

# Habilita la carga autom?tica de dashboards
setup.dashboards.enabled: true

# Configuraci?n de logging de Filebeat
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
