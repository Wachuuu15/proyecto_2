services:
  # Aplicaci?n Juice Shop - Aplicaci?n web vulnerable para testing
  juice-shop:
    build: .
    container_name: juice-shop
    # Ya no expone el puerto 3000 directamente, ahora pasa por Nginx
    expose:
      - "3000"  # Solo expone internamente en la red Docker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - elk-network  # Conecta a la red compartida

  # Reverse Proxy Nginx - Proxy inverso para Juice Shop con logging ampliado
  juice-proxy:
    image: nginx:1.25
    container_name: juice-proxy
    depends_on:
      juice-shop:
        condition: service_started
    ports:
      - "8080:80"  # Acceso externo al puerto 80 de Nginx (mapeado a 8080 en el host)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy-logs:/var/log/nginx
    networks:
      - elk-network
    restart: unless-stopped

  # Elasticsearch - Motor de b?squeda y almacenamiento de logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      # Configuraci?n para nodo ?nico (desarrollo)
      - discovery.type=single-node
      # Limita el uso de memoria (ajustar seg?n tu sistema)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Habilitar seguridad m?nima para que Security Detection Engine funcione
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      # Configuraci?n de seguridad simplificada (solo para desarrollo)
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Variables para configuraci?n autom?tica de usuarios
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"  # Puerto HTTP API
      - "9300:9300"  # Puerto de comunicaci?n entre nodos
    volumes:
      # Persiste los datos de Elasticsearch
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk-network
    restart: unless-stopped
    healthcheck:
      # Verifica que Elasticsearch est? respondiendo (con autenticaci?n)
      test: ["CMD-SHELL", "curl -u elastic:changeme -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana - Interfaz de visualizaci?n para Elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"  # Puerto web de Kibana
    volumes:
      # Archivo de configuración personalizado con clave de encriptación
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      # Conexión a Elasticsearch (la configuración está en kibana.yml)
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Usar service account token para autenticación con Elasticsearch
      # IMPORTANTE: NO usar ELASTICSEARCH_USERNAME ni ELASTICSEARCH_PASSWORD cuando se usa SERVICEACCOUNTTOKEN
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbjpITGJRaklzWlJxQ19Pcm5tSmRGZnln
      # Deshabilitar la generación automática del archivo de configuración
      - KIBANA_SKIP_PLUGINS=false
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Verifica que Kibana est? respondiendo
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Filebeat - Recolector de logs de Docker
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root  # Necesario para leer logs de Docker
    volumes:
      # Configuraci?n de Filebeat
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Logs de contenedores Docker
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Socket de Docker para metadata
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs de Blue Team (montado en /blue-team-logs dentro del contenedor)
      - ./scripts/logs:/blue-team-logs:ro
      # Logs de Nginx desde el volumen
      - proxy-logs:/var/log/nginx:ro
      # Datos de Filebeat (registry, estado)
      - filebeat-data:/usr/share/filebeat/data
    environment:
      # Conexi?n a Elasticsearch
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Credenciales de Elasticsearch (si está habilitada la seguridad)
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
      # Conexi?n a Kibana para dashboards
      - KIBANA_HOST=http://kibana:5601
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy  # Espera a que Elasticsearch est? listo
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

  # Blue Team Traffic Generator (Opcional) - Genera tráfico legítimo cada 15 minutos
  # Descomenta este servicio si prefieres ejecutar el script desde Docker en lugar de Task Scheduler
  # blue-team-traffic:
  #   image: alpine:latest
  #   container_name: blue-team-traffic
  #   volumes:
  #     - ./scripts:/scripts:ro
  #     - ./scripts/logs:/scripts/logs
  #   networks:
  #     - elk-network
  #   depends_on:
  #     juice-shop:
  #       condition: service_started
  #   restart: unless-stopped
  #   entrypoint: /bin/sh
  #   command: -c "apk add --no-cache curl bash dcron && chmod +x /scripts/*.sh && echo '*/15 * * * * /scripts/cron-entry.sh' | crontab - && crond -f -l 2"

# Definici?n de redes
networks:
  elk-network:
    driver: bridge

# Definici?n de vol?menes persistentes
volumes:
  elasticsearch-data:
    driver: local
  filebeat-data:
    driver: local
  proxy-logs:
    driver: local
