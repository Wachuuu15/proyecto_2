services:
  # Aplicaci?n Juice Shop - Aplicaci?n web vulnerable para testing
  juice-shop:
    build: .
    container_name: juice-shop
    ports:
      - "3000:3000"  # Mapea el puerto 3000 del contenedor al host
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - elk-network  # Conecta a la red compartida

  # Elasticsearch - Motor de b?squeda y almacenamiento de logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      # Configuraci?n para nodo ?nico (desarrollo)
      - discovery.type=single-node
      # Limita el uso de memoria (ajustar seg?n tu sistema)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Deshabilita seguridad para simplificar (NO usar en producci?n)
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"  # Puerto HTTP API
      - "9300:9300"  # Puerto de comunicaci?n entre nodos
    volumes:
      # Persiste los datos de Elasticsearch
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk-network
    restart: unless-stopped
    healthcheck:
      # Verifica que Elasticsearch est? respondiendo
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana - Interfaz de visualizaci?n para Elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"  # Puerto web de Kibana
    environment:
      # URL de conexi?n a Elasticsearch
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy  # Espera a que Elasticsearch est? listo
    restart: unless-stopped
    healthcheck:
      # Verifica que Kibana est? respondiendo
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Filebeat - Recolector de logs de Docker
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root  # Necesario para leer logs de Docker
    volumes:
      # Configuraci?n de Filebeat
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Logs de contenedores Docker
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Socket de Docker para metadata
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs de Blue Team (montado en /blue-team-logs dentro del contenedor)
      - ./scripts/logs:/blue-team-logs:ro
      # Datos de Filebeat (registry, estado)
      - filebeat-data:/usr/share/filebeat/data
    environment:
      # Conexi?n a Elasticsearch
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Conexi?n a Kibana para dashboards
      - KIBANA_HOST=http://kibana:5601
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy  # Espera a que Elasticsearch est? listo
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

  # Blue Team Traffic Generator (Opcional) - Genera tráfico legítimo cada 15 minutos
  # Descomenta este servicio si prefieres ejecutar el script desde Docker en lugar de Task Scheduler
  # blue-team-traffic:
  #   image: alpine:latest
  #   container_name: blue-team-traffic
  #   volumes:
  #     - ./scripts:/scripts:ro
  #     - ./scripts/logs:/scripts/logs
  #   networks:
  #     - elk-network
  #   depends_on:
  #     juice-shop:
  #       condition: service_started
  #   restart: unless-stopped
  #   entrypoint: /bin/sh
  #   command: -c "apk add --no-cache curl bash dcron && chmod +x /scripts/*.sh && echo '*/15 * * * * /scripts/cron-entry.sh' | crontab - && crond -f -l 2"

# Definici?n de redes
networks:
  elk-network:
    driver: bridge

# Definici?n de vol?menes persistentes
volumes:
  elasticsearch-data:
    driver: local
  filebeat-data:
    driver: local
